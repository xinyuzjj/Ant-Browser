database:
  type: sqlite
  sqlite:
    path: data/app.db
app:
  name: Ant Browser
  window:
    width: 1750
    height: 1000
    min_width: 1200
    min_height: 700
runtime:
  max_memory_mb: 0
  gc_percent: 100
logging:
  level: info
  # 默认开启文件日志与轮转：插件持久安装失败、内核启动失败等问题在界面上往往不可见，
  # 没有日志只能靠复现。轮转上限 20MB × 3 份 + 7 天，占用可控。
  file_enabled: true
  file_path: data/logs/app.log
  format: text
  buffer_size: 4
  async_queue_size: 1000
  flush_interval_ms: 1000
  rotation:
    enabled: true
    max_size_mb: 20
    max_age: 7
    max_backups: 3
    time_interval: daily
  interceptor:
    enabled: true
    log_parameters: true
    log_results: true
    sensitive_fields:
      - password
      - token
      - secret
browser:
  user_data_root: data
  default_fingerprint_args:
    - --fingerprint-brand=Chrome
    - --fingerprint-platform=windows
  default_launch_args:
    - --disable-sync
    - --no-first-run
  default_bookmarks: []
  cores: []
  proxies: []
  profiles: []
launch_server:
  port: 19876
automation:
  enabled: false
  install_policy: on_demand
  runtime_version: node-22.15.1-playwright-core-1.59.0
  headless_default: false
  keep_runtime_on_disable: true
  node_source: auto
  system_node_path: ""
  node_version: 22.15.1
  playwright_core_version: 1.59.0

backup:
  channels:
    openlist:
      remote_path: ant-chrome/backups
      upload_rate_limit_mbps: 0
  schedule:
    enabled: false
    daily_time: "02:00"
